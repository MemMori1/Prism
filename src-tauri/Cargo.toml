[package]
name = "prism"
version = "0.3.0"
description = "Prism — 多引擎 AI 编码 Agent 指挥台"
edition = "2021"
rust-version = "1.77"

[lib]
name = "prism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools：让 release 构建也能开合开发者工具（debug 构建默认就有）。
# 不想让线上包暴露调试入口的话，去掉这个特性即可——F12/按钮在 release 下会静默失效。
# unstable：面板浏览器要把子 webview 挂进主窗口（`Window::add_child`），这块
# 目前在 Tauri 里还标着 unstable。风险收在 `browser.rs` 一个模块里：
# 创建失败就报错并回落到「用系统浏览器打开」，不会连累其它功能。
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
# 关掉默认特性会连 TLS 一起关掉，https 端点会直接报 "error sending request"。
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-native-roots",
    "system-proxy",
    "http2",
] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 工作台「新增目录」挑本机文件夹。
tauri-plugin-dialog = "2"
chrono = "0.4.45"
# DeepSeek Harness 的会话日志是 append-only 的多帧 zstd。必须用 `stream::read::Decoder`
# 这类"连续解多帧"的接口：只解第一帧的话，读到的是 header 那一行，看起来像空日志。
zstd = "0.13"
# grep 的 `regex: true` 模式：默认按字面量搜，显式开才当正则。
# 同版本已作为 tauri-utils 的传递依赖在锁文件里，不新增下载。
regex = "1"
# APK 里的 AndroidManifest.xml 是 deflate 压缩的 AXML，清单解析要现解压。
# 同版本已作为 tauri-utils 的传递依赖在锁文件里，不新增下载。
flate2 = "1"
sha2 = "0.10.9"
sha1 = "0.10.7"
md-5 = "0.10.6"
# 手机链接（phone.link 插件）：LAN 配对 HTTP 服务、二维码、令牌随机源。
tiny_http = "0.12"
qrcodegen = "1.8"
getrandom = "0.2"

# run_command 结束时要连同命令拉起的子进程一起收掉：按进程组发信号要用到它。
[target.'cfg(unix)'.dependencies]
libc = "0.2"
